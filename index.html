<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중산 당근 · 교내 나눔 장터</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 테마: 행사 안내 사이트(hub)와 같은 디자인. 겨자색 바탕 위 크림색 판, 굵은 헤드라인과 형광펜, 기하학 도형, 색 사진 카드. 글꼴은 Pretendard 하나. */
:root{
  --mustard:#fbcb70; --cream:#fcf8f1; --cream-2:#f4ecdf; --white:#fffdf9; --hl:#ffd77a; --line:#e7dccb;
  --ink:#141414; --ink-2:#47433d; --muted:#6b665d;
  --purple:#7b4de0; --coral:#f2774e; --pink:#e8336d; --green:#1e9e5a; --blue:#5ab8ff; --sun:#f9c74f;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --wrap:1120px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--ink);background:var(--mustard);line-height:1.6;word-break:keep-all;overflow-wrap:break-word;font-size:16px;letter-spacing:-.01em}
::selection{background:var(--ink);color:var(--hl)}
a{color:var(--ink);text-decoration-color:var(--coral);text-decoration-thickness:2px;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.site{overflow-x:clip}
.page{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{position:relative;background:var(--cream);padding:clamp(24px,4.4vw,52px) clamp(18px,4.4vw,56px);margin-top:14px}
.decor{position:absolute;z-index:0;pointer-events:none;display:block}
.panel>*:not(.decor){position:relative;z-index:1}
.spin:not([data-speed]){animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hl{background:linear-gradient(transparent 56%,var(--hl) 56% 94%,transparent 94%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.q{display:block;font-family:Georgia,'Times New Roman',serif;font-size:80px;font-weight:700;line-height:.8;height:.44em;color:var(--qc,var(--ink));letter-spacing:0}
.c-purple{--c:var(--purple)} .c-coral{--c:var(--coral)} .c-pink{--c:var(--pink)} .c-green{--c:var(--green)} .c-blue{--c:var(--blue)} .c-sun{--c:var(--sun)}

/* 머리 */
.top{padding-top:22px}
.top .panel{margin-top:0}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:28px 44px;align-items:center}
.hero h1{position:relative;display:inline-block;margin:8px 0 0;font-size:clamp(52px,8.2vw,104px);font-weight:900;line-height:1;letter-spacing:-.055em}
.hero h1 a{text-decoration:none}
.hero h1 .star{position:absolute;top:-.02em;right:-.4em;width:.32em;height:.32em;color:var(--purple)}
.kick{margin:16px 0 0;font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--ink-2)}
.lead{margin:8px 0 0;font-size:17px;color:var(--ink-2);max-width:460px}
.whoami{display:inline-flex;align-items:center;gap:4px;max-width:100%;margin-top:20px;background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:4px 6px 4px 4px}
.whoami label{font-size:13px;font-weight:800;background:var(--ink);color:var(--cream);border-radius:999px;padding:4px 12px;white-space:nowrap}
.whoami select{width:auto;min-width:0;border:0;background:transparent;font-weight:800;padding:4px 6px;cursor:pointer}
.collage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start;perspective:900px}
.collage .ph:nth-child(2){margin-top:44px}
.collage .ph:nth-child(3){margin-top:18px}
.ph{display:block;aspect-ratio:4/5;border-radius:18px;background:var(--c) center/cover no-repeat;transition:transform .5s var(--ease)}
.ph:hover{transform:rotate(-2deg) scale(1.03)}

/* 메뉴 */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px;background:var(--mustard)}
.tabbar{display:flex;gap:2px;padding:5px;background:var(--cream);border-radius:999px;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;white-space:nowrap;padding:7px 16px;border-radius:999px;font-size:15px;font-weight:800;color:var(--ink-2);text-decoration:none;transition:color .2s,background .2s}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--cream)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--pink);color:#fff;font-size:12px;font-weight:900}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--mustard)}

/* 시연 순서 */
.guide-inner{display:flex;gap:10px 16px;align-items:center;background:var(--ink);color:var(--cream);border-radius:18px;padding:12px 12px 12px 18px;font-size:14px}
.guide b{font-size:13px;font-weight:900;background:var(--hl);color:var(--ink);border-radius:999px;padding:2px 12px;white-space:nowrap}
.guide ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;flex:1;counter-reset:s}
.guide li{counter-increment:s;font-weight:600}
.guide li::before{content:counter(s);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--coral);color:var(--ink);font-size:12px;font-weight:900;margin-right:7px;vertical-align:1px}
.x{flex:none;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--cream);color:var(--ink);font-size:18px;line-height:1;cursor:pointer}

/* 본문 */
.sec-h{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 14px;margin:0 0 22px}
.sec-h .q{flex-basis:100%;font-size:72px}
.sec-h h2{margin:0;font-size:clamp(28px,4vw,46px);font-weight:900;letter-spacing:-.05em;line-height:1.08}
.sec-h .count{display:inline-block;margin-bottom:.35em;background:var(--hl);border-radius:999px;padding:2px 14px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.sec-lead{margin:-8px 0 24px;color:var(--ink-2);font-size:15.5px;max-width:640px}
.sub-h{display:flex;align-items:center;gap:10px;margin:8px 0 12px;font-size:22px;font-weight:900;letter-spacing:-.03em}
.sub-h small{font-weight:600;color:var(--muted);font-size:14px;letter-spacing:0}

/* 필터 */
.filters{display:grid;grid-template-columns:auto minmax(160px,1fr) auto auto;gap:10px 14px;align-items:center;margin:0 0 24px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:14px;font-weight:800;padding:7px 15px;border:0;border-radius:999px;background:var(--white);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.chip:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--cream);box-shadow:none}
input[type=search],input[type=text],select,textarea{width:100%;background:var(--white);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;transition:border-color .2s}
input[type=search]{border-radius:999px;padding-left:18px}
input[type=search]:focus,input[type=text]:focus,select:focus,textarea:focus{border-color:var(--ink)}
select{cursor:pointer}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer}
.toggle input{width:18px;height:18px;margin:0;accent-color:var(--ink)}

/* 물건 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px 14px}
.card{position:relative;min-width:0;background:var(--white);border:1.5px solid var(--line);border-radius:20px;transition:transform .25s var(--ease),border-color .25s;animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0) * 40ms)}
.card:hover{transform:translateY(-4px);border-color:var(--ink)}
.card>a{display:block;padding:10px 10px 14px;text-decoration:none;color:inherit}
.thumb{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--cream-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.card:hover .thumb img{transform:scale(1.05)}
.nophoto{position:absolute;right:8px;bottom:8px;font-size:11.5px;font-weight:800;color:var(--cream);background:rgba(20,20,20,.72);border-radius:999px;padding:2px 9px}
.card h3{margin:12px 4px 2px;font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
.meta{margin:0 4px;color:var(--ink-2);font-size:13px}
.meta b{background:var(--hl);color:var(--ink);border-radius:999px;padding:0 7px;white-space:nowrap}
.card.is-done{opacity:.62}
.card.is-done img{filter:grayscale(.75)}
.card.is-done:hover{opacity:.9}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.stamp,.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:900;line-height:1;white-space:nowrap;border-radius:999px;padding:6px 11px 6px 9px;background:var(--white);color:var(--ink)}
.stamp::before,.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.stamp.reserved,.tag.reserved{background:var(--hl)}
.stamp.reserved::before,.tag.reserved::before{background:var(--coral)}
.stamp.done,.tag.done{background:var(--ink);color:var(--cream)}
.stamp.done::before,.tag.done::before{background:var(--muted)}
.stamp{position:absolute;z-index:2;top:20px;left:20px;pointer-events:none;box-shadow:0 4px 12px -4px rgba(20,20,20,.4)}
.tag{box-shadow:inset 0 0 0 1.5px var(--line)}
.tag.reserved,.tag.done{box-shadow:none}

.empty{grid-column:1/-1;text-align:center;padding:44px 16px;color:var(--ink-2);background:var(--white);border:1.5px dashed #cfc3ae;border-radius:18px}
.empty b{display:block;margin-bottom:4px;font-size:20px;font-weight:900;color:var(--ink)}

/* 상세 */
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:22px;padding:7px 15px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--ink);font-size:14px;font-weight:800;text-decoration:none;transition:background .2s,color .2s}
.back:hover{background:var(--ink);color:var(--cream)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:start}
.detail>div{min-width:0}
.photo{position:relative;margin:0}
.photo img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:20px;background:var(--cream-2)}
.photo figcaption{margin-top:10px;font-size:13px;font-weight:700;color:var(--muted)}
.photo .stamp{top:16px;left:16px;font-size:14px}
.kicker{margin:0;color:var(--ink-2);font-size:14px;font-weight:800;letter-spacing:.06em}
.detail h2{margin:6px 0 0;font-size:clamp(28px,3.6vw,42px);font-weight:900;letter-spacing:-.045em;line-height:1.15}
.facts{margin:22px 0;display:grid;gap:9px}
.facts div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:baseline}
.facts dt{min-width:68px;font-size:12.5px;font-weight:800;text-align:center;background:var(--ink);color:var(--cream);border-radius:999px;padding:0 10px}
.facts dd{margin:0;font-weight:600}
.desc{position:relative;margin:0;background:var(--cream-2);border-radius:18px;padding:16px 20px 16px 56px;font-size:15.5px}
.desc::before{content:"“";position:absolute;left:16px;top:6px;font-family:Georgia,'Times New Roman',serif;font-size:56px;font-weight:700;line-height:1;color:var(--coral)}
.box{margin-top:20px;background:var(--white);border:2px solid var(--ink);border-radius:18px;padding:18px 20px}
.box h3{margin:0 0 8px;font-size:17px;font-weight:900;letter-spacing:-.02em}
.box p{margin:0 0 8px}
.box p:last-child{margin-bottom:0}
.box.good{border-color:var(--green);background:#effaf3}
.box.quiet{border:1.5px dashed #cfc3ae;background:transparent;color:var(--ink-2)}
.box label{display:block;font-weight:800;font-size:14px;margin-bottom:6px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:800;line-height:1.3;color:var(--cream);background:var(--ink);border:0;border-radius:999px;padding:11px 20px;cursor:pointer;text-decoration:none;transition:transform .15s var(--ease),background .2s,color .2s}
.btn:hover{transform:translateY(-2px);background:var(--purple)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost{color:var(--ink);background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--cream)}
.btn.go{background:var(--green)}
.btn.small{padding:7px 14px;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.req{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 0;border-top:1.5px solid var(--line)}
.req:first-of-type{border-top:0;padding-top:4px}
.who{font-weight:800}
.who small{font-weight:500;color:var(--muted);margin-left:6px}
.msg{color:var(--ink-2);font-size:14px;margin:2px 0 0}
.pickform{margin-top:10px;padding:14px;background:var(--cream);border:1.5px solid var(--line);border-radius:14px}

/* 내 물건 */
.rows{display:grid;gap:10px;margin-bottom:34px}
.rows:last-child{margin-bottom:0}
.row-item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--white);border:1.5px solid var(--line);border-radius:18px;padding:10px 16px 10px 10px;text-decoration:none;color:inherit;transition:border-color .2s,transform .25s var(--ease)}
.row-item:hover{border-color:var(--ink);transform:translateX(4px)}
.row-item>div{min-width:0}
.row-item img{width:64px;height:80px;object-fit:cover;border-radius:12px;display:block}
.row-item h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.02em}
.row-item p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.row-item.alert{border-color:var(--coral);background:#fff3ec}
.row-item.happy{border-color:var(--green);background:#effaf3}

/* 물건 올리기 */
.form{max-width:720px}
.field{display:grid;gap:6px;margin:0 0 18px;border:0;padding:0;min-width:0}
.field>label,.field>legend{font-weight:800;font-size:14px;padding:0;margin-bottom:2px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:inline-block;padding:7px 15px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;background:var(--white);box-shadow:inset 0 0 0 1.5px var(--line)}
.seg input:checked+span{background:var(--ink);color:var(--cream);box-shadow:none}
.seg input:focus-visible+span{outline:3px solid var(--purple);outline-offset:3px}
input[type=file]{max-width:100%;font-size:14px}
input[type=file]::file-selector-button{font:inherit;font-weight:800;margin-right:10px;padding:7px 14px;border:0;border-radius:999px;background:var(--ink);color:var(--cream);cursor:pointer}
.preview{display:flex;gap:10px;align-items:center}
.preview img{width:96px;height:120px;object-fit:cover;border-radius:12px}
.error{color:var(--pink);font-size:14px;font-weight:800;min-height:1em;margin:0 0 6px}

footer .panel{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;margin-bottom:24px;padding-block:20px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.linkbtn{border:0;background:transparent;text-decoration:underline;text-decoration-color:var(--coral);text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer;color:var(--ink-2);font-size:13.5px;font-weight:700;padding:2px 4px}
.linkbtn.armed{color:var(--pink);font-weight:900}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--cream);padding:11px 22px;border-radius:999px;opacity:0;transition:opacity .22s,transform .3s var(--ease);pointer-events:none;font-weight:700;z-index:50;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 24px -10px rgba(20,20,20,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .collage{max-width:460px}
  body:not([data-view="list"]) .collage,body:not([data-view="list"]) .lead{display:none}
  .detail{grid-template-columns:minmax(0,1fr);gap:24px}
  .photo{max-width:440px}
  .filters{grid-template-columns:minmax(0,1fr) auto}
  .filters .chips,.filters input[type=search]{grid-column:1/-1}
  .three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .guide-inner{align-items:flex-start}
}
@media (max-width:640px){
  .q{font-size:60px}
  .sec-h .q{font-size:54px}
  .decor.sm-hide{display:none}
  .collage .ph:nth-child(2){margin-top:26px}
  .collage .ph:nth-child(3){margin-top:10px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
  .card>a{padding:8px 8px 12px}
  .card h3{font-size:15px;margin-top:10px}
  .stamp{top:16px;left:16px;font-size:11.5px;padding:5px 9px 5px 8px}
  .three{grid-template-columns:minmax(0,1fr)}
  .row-item{grid-template-columns:56px minmax(0,1fr)}
  .row-item img{width:56px;height:70px}
  .row-item .tag{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

/* ───────── 데이터 계층 (Store) ─────────
   화면 코드는 Store의 함수만 부릅니다.
   여러 기기가 같은 데이터를 보게 하려면(B안: Firebase·Supabase)
   이 블록 안의 load / persist 부분만 바꾸면 됩니다.
   시연용 물건의 photo는 'sample:이름'으로 두고, 화면에서 PHOTOS 사진으로 바꿔 보여 줍니다. */
const Store = (() => {
  const KEY = 'jungsan-carrot-v2';
  let db = null;
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  function seed() {
    const t = Date.now(), m = 60 * 1000;
    const it = (id, photo, title, category, subject, grade, condition, ownerId, place, description, ago, extra = {}) =>
      ({ id, title, category, subject, grade, condition, ownerId, place, description, photo: 'sample:' + photo, status: 'open', reservedTo: null, meetup: '', createdAt: t - ago * m, ...extra });
    const items = [
      it('i10', 'physics', '물리학Ⅰ 개념서', '참고서', '물리학', 2, '사용감 조금', 'u3', '점심시간 3층 계단 앞', '연필 필기는 지웠어요. 문제는 거의 안 풀었어요.', 18),
      it('i8',  'shirt', '교복 셔츠 (95)', '교복', '기타', 0, '새것 같음', 'u2', '방과 후 1층 현관', '한 학기 입고 작아져서 내놓아요. 세탁했어요.', 42),
      it('i2',  'english', '영어Ⅰ 자습서', '참고서', '영어', 2, '새것 같음', 'u1', '점심시간 2층 2-3반 앞', '본문 해석이 자세해서 내신 준비에 좋아요.', 65),
      it('i1',  'math', '수학Ⅰ 교과서 (필기 조금)', '교과서', '수학', 2, '사용감 조금', 'u3', '점심시간 3층 3-5반 앞', '중요 공식에만 형광펜 표시했어요. 찢어진 곳 없어요.', 95),
      it('i4',  'chem', '화학Ⅰ 문제집', '참고서', '화학', 2, '사용감 많음', 'u1', '', '앞 3단원은 풀었어요. 뒤쪽은 깨끗해요.', 140,
         { status: 'reserved', reservedTo: 'u2', meetup: '금요일 점심 4층 ICT기획부 앞' }),
      it('i3',  'gym', '체육복 상의 (L)', '체육복', '체육', 0, '사용감 조금', 'u3', '체육관 입구', '이름표 떼었어요.', 210),
      it('i7',  'literature', '문학 교과서', '교과서', '국어', 2, '사용감 조금', 'u3', '', '작품 옆에 간단한 메모가 있어요.', 260),
      it('i9',  'science', '통합과학 교과서', '교과서', '통합과학', 1, '사용감 조금', 'u1', '점심시간 2층 2-3반 앞', '', 330),
      it('i5',  'history', '한국사 교과서', '교과서', '한국사', 1, '새것 같음', 'u1', '', '거의 안 펴 봤어요.', 400),
      it('i6',  'info', '정보 교과서', '교과서', '정보', 1, '사용감 조금', 'u3', '', '', 1500,
         { status: 'done', reservedTo: 'u2', meetup: '화요일 방과 후 컴퓨터실' }),
    ];
    const rq = (id, itemId, requesterId, message, ago) => ({ id, itemId, requesterId, message, createdAt: t - ago * m });
    const requests = [
      rq('r1', 'i1', 'u2', '내년에 쓰려고요! 점심시간에 받으러 갈게요.', 80),
      rq('r2', 'i2', 'u2', '자습서 꼭 필요해요.', 50),
      rq('r3', 'i4', 'u2', '문제집 찾고 있었어요!', 130),
      rq('r4', 'i8', 'u1', '동생이 입으면 딱 맞을 것 같아요.', 30),
      rq('r5', 'i10', 'u1', '물리 선택했는데 개념서가 없어요.', 12),
      rq('r6', 'i10', 'u2', '저도 원해요!', 6),
      rq('r7', 'i6', 'u2', '정보 교과서 필요해요.', 1400),
    ];
    return { items, requests };
  }

  function load() {
    if (db) return db;
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) db = JSON.parse(raw);
    } catch (e) { db = null; }
    if (!db || !Array.isArray(db.items) || !Array.isArray(db.requests)) { db = seed(); persist(); }
    return db;
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
    catch (e) { return false; } // 저장이 막힌 환경에서는 메모리에만 둡니다
  }
  const find = id => load().items.find(i => i.id === id) || null;

  return {
    items: () => load().items.slice(),
    item: find,
    requestsFor: itemId => load().requests.filter(r => r.itemId === itemId).sort((a, b) => a.createdAt - b.createdAt),
    requestsBy: userId => load().requests.filter(r => r.requesterId === userId).sort((a, b) => b.createdAt - a.createdAt),
    request: id => load().requests.find(r => r.id === id) || null,
    addItem(data) {
      const item = { id: uid('i'), status: 'open', reservedTo: null, meetup: '', createdAt: Date.now(), ...data };
      load().items.unshift(item);
      if (!persist()) {
        item.photo = '';                       // 사진 때문에 저장 공간이 부족하면 사진 없이 저장
        if (!persist()) { /* 메모리에만 유지 */ }
      }
      return item;
    },
    want(itemId, userId, message) {
      const d = load();
      if (d.requests.some(r => r.itemId === itemId && r.requesterId === userId)) return;
      d.requests.push({ id: uid('r'), itemId, requesterId: userId, message, createdAt: Date.now() });
      persist();
    },
    cancelWant(itemId, userId) {
      const d = load();
      d.requests = d.requests.filter(r => !(r.itemId === itemId && r.requesterId === userId));
      persist();
    },
    reserve(itemId, userId, meetup) {
      const i = find(itemId); if (!i) return;
      Object.assign(i, { status: 'reserved', reservedTo: userId, meetup });
      persist();
    },
    release(itemId) {
      const i = find(itemId); if (!i) return;
      Object.assign(i, { status: 'open', reservedTo: null, meetup: '' });
      persist();
    },
    complete(itemId) {
      const i = find(itemId); if (!i) return;
      i.status = 'done';
      persist();
    },
    reset() { db = seed(); persist(); },
  };
})();

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const gradeLabel = g => Number(g) === 0 ? '전 학년' : `${g}학년용`;
const mask = n => n.length >= 3 ? n[0] + '*' + n.slice(2) : n[0] + '*';
function timeAgo(t) {
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return '방금';
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  return Math.floor(s / 86400) + '일 전';
}

function resizeImage(file, max = 560) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function route() {
  const [view = 'list', arg] = (location.hash.slice(1) || 'list').split('/');
  if (view === 'item') renderDetail(arg);
  else if (view === 'new') renderNew();
  else if (view === 'mine') renderMine();
  else renderList();
  document.body.dataset.view = ['item', 'new', 'mine'].includes(view) ? view : 'list';
  updateNav(view === 'item' ? '' : view);
}
function go(hash) {
  if (location.hash === hash) route(); else location.hash = hash;
  window.scrollTo({ top: 0 });
}

window.addEventListener('hashchange', () => { picking = null; route(); window.scrollTo({ top: 0 }); });

$('#me').addEventListener('change', e => {
  me = e.target.value;
  ls.set('jungsan-carrot-me', me);
  picking = null;
  route();
  toast(`${userById(me).name}(${userById(me).grade}학년)으로 바꿨어요`);

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, id, value, req } = el.dataset;
  if (action === 'grade') { filter.grade = value; updateGrid(); }
  else if (action === 'cancel') { Store.cancelWant(id, me); toast('신청을 취소했어요'); route(); }
  else if (action === 'pick') { picking = req; route(); const f = $('#meetup'); if (f) f.focus(); }
  else if (action === 'unpick') { picking = null; route(); }
  else if (action === 'release') { Store.release(id); toast('예약을 취소했어요. 다시 나눔 중이에요'); route(); }
  else if (action === 'complete') { Store.complete(id); toast('나눔 완료! 고마워요'); route(); }
  else if (action === 'hide-guide') { $('#guide').hidden = true; ls.set('jungsan-carrot-guide', 'off'); }
  else if (action === 'show-guide') { $('#guide').hidden = false; ls.set('jungsan-carrot-guide', 'on'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (action === 'reset') {
    if (el.dataset.armed) {
      Store.reset(); picking = null; delete el.dataset.armed; el.classList.remove('armed'); el.textContent = '시연 데이터 초기화';
      toast('시연 데이터를 처음 상태로 되돌렸어요'); go('#list');
    } else {
      el.dataset.armed = '1'; el.classList.add('armed'); el.textContent = '한 번 더 누르면 초기화';
      setTimeout(() => { if (el.dataset.armed) { delete el.dataset.armed; el.classList.remove('armed'); el.textContent = '시연 데이터 초기화'; } }, 3000);
    }
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { filter.q = e.target.value; updateGrid(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'subject') { filter.subject = t.value; updateGrid(); }
  else if (t.id === 'hideDone') { filter.hideDone = t.checked; updateGrid(); }
  else if (t.id === 'f-cat') {
    if (t.value === '체육복') $('#f-subject').value = '체육';
    if (t.value === '교복') $('#f-subject').value = '기타';
    if (t.value === '체육복' || t.value === '교복') $('#f-grade').value = '0';
  }
  else if (t.id === 'f-photo') {
    const file = t.files && t.files[0];
    const box = $('#preview');
    if (!file) { pendingPhoto = ''; box.innerHTML = ''; return; }
    try {
      pendingPhoto = await resizeImage(file);
      box.innerHTML = `<img src="${pendingPhoto}" alt="고른 사진 미리보기"><button type="button" class="btn ghost small" id="clear-photo">사진 빼기</button>`;
      $('#clear-photo').onclick = () => { pendingPhoto = ''; box.innerHTML = ''; t.value = ''; };
    } catch (err) {
      pendingPhoto = ''; box.innerHTML = '<span class="error">사진을 읽지 못했어요. 다른 사진을 골라 주세요.</span>';
    }
  }
});

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'want') {
    Store.want(f.dataset.id, me, f.elements.message.value.trim());
    toast('원해요 신청 완료!');
    route();
  } else if (kind === 'reserve') {
    const r = Store.request(f.dataset.req);
    const meetup = f.elements.meetup.value.trim();
    if (!meetup) { f.elements.meetup.focus(); return; }
    Store.reserve(f.dataset.id, r.requesterId, meetup);
    picking = null;
    toast(`${userById(r.requesterId).name}에게 예약했어요`);
    route();
  } else if (kind === 'new') {
    const title = f.elements.title.value.trim();
    if (!title) { $('#f-error').textContent = '물건 이름을 적어 주세요.'; f.elements.title.focus(); return; }
    const item = Store.addItem({
      title,
      category: f.elements.category.value,
      subject: f.elements.subject.value,
      grade: Number(f.elements.grade.value),
      condition: f.elements.condition.value,
      place: f.elements.place.value.trim(),
      description: f.elements.description.value.trim(),
      photo: pendingPhoto,
      ownerId: me,
    });
    pendingPhoto = '';
    toast('나눔 등록 완료!');
    go('#item/' + item.id);
  }
});

/* ───────── 움직임 (안내 사이트와 같은 방식) ─────────
   도형: 스크롤 깊이감 + 마우스 자기장 + 스프링 반동
   - 마우스가 멀리 있으면 층마다 반대로 따라 움직여 깊이감이 생깁니다
   - 가까이 오면 밀려나며 부풀고, 휘두르면 그 방향으로 튕기고, 스치면 돕니다
   - 움직이는 만큼 진행 방향으로 늘어났다가(젤리) 스프링처럼 제자리로 돌아옵니다
   사진 카드: 마우스를 따라 기웁니다. 동작 줄이기 설정이면 모두 멈춥니다. */
function startMotion() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const shapes = [...document.querySelectorAll('.decor')].map((el, i) => {
    if (!el.dataset.speed) el.dataset.speed = '0'; // CSS 회전을 끄고 스크립트가 돌립니다
    return { el, speed: +el.dataset.speed, spin: el.classList.contains('spin'), phase: i * 1.7,
      x: 0, y: 0, vx: 0, vy: 0, s: 1, vs: 0, a: 0, va: 0, par: 0, size: 0 };
  });
  const ptr = { x: 0, y: 0, dx: 0, dy: 0, on: false };
  addEventListener('pointermove', e => {
    if (ptr.on) { ptr.dx += e.clientX - ptr.x; ptr.dy += e.clientY - ptr.y; }
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true;
  }, { passive: true });
  const off = e => { if (e.type !== 'pointerup' || e.pointerType !== 'mouse') ptr.on = false; };
  addEventListener('pointerup', off); addEventListener('pointercancel', off); addEventListener('blur', off);
  document.addEventListener('mouseout', e => { if (!e.relatedTarget) ptr.on = false; });
  addEventListener('resize', () => shapes.forEach(sh => { sh.size = 0; }));
  let lastY = scrollY;
  const frame = t => {
    const vw = innerWidth, vh = innerHeight, nx = ptr.on ? ptr.x / vw * 2 - 1 : 0, ny = ptr.on ? ptr.y / vh * 2 - 1 : 0;
    const scrolled = scrollY - lastY; lastY = scrollY;
    const boxes = shapes.map(sh => sh.el.getBoundingClientRect()); // 먼저 모두 읽고, 아래에서 한꺼번에 씁니다
    shapes.forEach((sh, i) => {
      const b = boxes[i];
      if (!b.width || b.bottom < -300 || b.top > vh + 300) return;
      if (!sh.size) sh.size = Math.max(b.width, b.height) / sh.s;
      const cx = b.left + b.width / 2 - sh.x, cy = b.top + b.height / 2 - sh.y - sh.par; // 움직이기 전 자리
      const par = (cy - vh / 2) * -sh.speed;
      const dir = sh.speed < 0 ? -1 : 1, depth = dir * (14 + sh.size * .18);
      let tx = nx * depth + Math.sin(t / 1300 + sh.phase) * 5;
      let ty = ny * depth * .7 + Math.cos(t / 1700 + sh.phase) * 6;
      let ts = 1;
      if (ptr.on) {
        const ex = cx + sh.x - ptr.x, ey = cy + sh.y + par - ptr.y, d = Math.hypot(ex, ey) || 1;
        const R = 150 + sh.size * .9;
        if (d < R) {
          const f = (1 - d / R) ** 2;
          tx += ex / d * f * 95; ty += ey / d * f * 95;
          ts += f * .35;
          sh.vx += ptr.dx * f * .14; sh.vy += ptr.dy * f * .14;
          sh.va += (ptr.dx * ey - ptr.dy * ex) / d * f * .045;
        }
      }
      sh.vx = (sh.vx + (tx - sh.x) * .07) * .84; sh.x += sh.vx;
      sh.vy = (sh.vy + (ty - sh.y) * .07) * .84; sh.y += sh.vy;
      sh.vs = (sh.vs + (ts - sh.s) * .12) * .78; sh.s += sh.vs;
      if (sh.spin) { sh.va *= .96; sh.a += .3 + sh.va + scrolled * .12; }
      else { sh.va = (sh.va + (nx * 10 * dir + sh.vx * 1.4 - sh.a) * .06) * .82; sh.a += sh.va; }
      sh.par = par;
      const st = Math.min(Math.hypot(sh.vx, sh.vy) * .02, .34), ang = Math.atan2(sh.vy, sh.vx) * 57.3;
      sh.el.style.transform = `translate3d(${sh.x.toFixed(1)}px,${(sh.y + par).toFixed(1)}px,0) rotate(${ang.toFixed(1)}deg) scale(${((1 + st) * sh.s).toFixed(3)},${((1 - st * .55) * sh.s).toFixed(3)}) rotate(${(sh.a - ang).toFixed(1)}deg)`;
    });
    ptr.dx = ptr.dy = 0;
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  const collage = $('.collage');
  if (collage && matchMedia('(hover: hover) and (pointer: fine)').matches) {
    const cards = [...collage.querySelectorAll('.ph')];
    const area = collage.closest('.hero');
    area.addEventListener('pointermove', e => {
      const r = collage.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      cards.forEach((c, i) => {
        const k = i % 2 ? 1 : -1;
        c.style.transform = `rotateY(${(x * 12).toFixed(2)}deg) rotateX(${(-y * 12).toFixed(2)}deg) translate3d(${(x * k * 10).toFixed(1)}px,${(y * 10).toFixed(1)}px,0)`;
      });
    });
    area.addEventListener('pointerleave', () => cards.forEach(c => { c.style.transform = ''; }));
  }
}

/* ───────── 시작 ───────── */
document.querySelectorAll('[data-photo]').forEach(el => {
  if (PHOTOS[el.dataset.photo]) el.style.backgroundImage = `url(${PHOTOS[el.dataset.photo]})`;
});
renderWho();
if (ls.get('jungsan-carrot-guide', 'on') !== 'off') $('#guide').hidden = false;
route();
startMotion();
})();
</script>
